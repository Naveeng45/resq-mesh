# fly.toml app configuration file generated for MealMesh
#
# Deploy:
#   brew install flyctl   # or: curl -L https://fly.io/install.sh | sh
#   fly auth login
#   fly launch --no-deploy   # first time only, or: fly apps create mealmesh
#   fly deploy
#
# Optional Bedrock for Advisor / Extract (deterministic paths work without):
#   fly secrets set AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_DEFAULT_REGION=us-east-1

app = 'mealmesh'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/scenario'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
